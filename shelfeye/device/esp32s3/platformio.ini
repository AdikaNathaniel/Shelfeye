; ShelfEye firmware for an ESP32-S3 camera board (8 MB flash, 8 MB octal PSRAM, OV3660/OV2640).
;
; Build and flash:   pio run -t upload
; Serial log:        pio device monitor
;
; Secrets are NOT compiled in. The device reads /.env from its flash at start-up
; (see .env.example), uploaded from data/.env with:  pio run -t uploadfs
; (A microSD card is optional and not used in this setup.)

[env:esp32s3cam]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; quad flash + octal PSRAM (N8R8 module)
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

; The board's USB port on this computer (USB VID:PID 303A:1001). COM3/COM4 are
; Bluetooth ports. If Windows gives the board another number, change both lines.
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -DBOARD_HAS_PSRAM
    ; This board's USB-C port is the ESP32-S3's own USB, so the log is sent over USB.
    ; (Boards with a separate USB-to-serial chip need 0 here instead.)
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Camera/microSD pin layout (ESP32-S3-EYE, also Freenove and generic "ESP32-S3 CAM"
    ; boards). See src/board_pins.h.
    -DCAMERA_MODEL_ESP32S3_EYE
    ; 0 hides the Arduino libraries' own messages (e.g. the harmless, constant
    ; "setSocketOption ... Bad file number"). ShelfEye's messages still show.
    -DCORE_DEBUG_LEVEL=0
